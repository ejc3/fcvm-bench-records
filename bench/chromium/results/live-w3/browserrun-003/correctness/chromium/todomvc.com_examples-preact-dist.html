<!DOCTYPE html><html lang="en" data-framework="preact"><head>
        <meta charset="UTF-8">
        <meta name="description" content="TodoMVC app written with Preact.">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <title>TodoMVC: Preact</title>
        <link rel="stylesheet" href="app.css">
    </head>
    <body>
        <section class="todoapp" id="root"><header class="header"><h1>todos</h1><input class="new-todo" placeholder="What needs to be done?" autofocus="true"></header><main class="main" hidden=""><div class="toggle-all-container"><input class="toggle-all" type="checkbox"><label class="toggle-all-label" for="toggle-all">Toggle All Input</label></div><ul class="todo-list"></ul></main><footer class="footer" hidden=""><span class="todo-count">0 items left!</span><ul class="filters"><li><a href="#/" class="selected">All</a></li><li><a href="#/active" class="">Active</a></li><li><a href="#/completed" class="">Completed</a></li></ul><button class="clear-completed" hidden="">Clear completed</button></footer></section>
        <footer class="info">
            <p>Double-click to edit a todo</p>
			<p>Created by the TodoMVC Team</p>
			<p>Part of <a href="http://todomvc.com">TodoMVC</a></p>
        </footer>
		<script async="" src="https://www.google-analytics.com/analytics.js"></script><script src="base.js"></script>
        <script src="app.js"></script>
    

</body></html>
