<!DOCTYPE html><html lang="en" data-framework="react"><head><meta charset="UTF-8"><meta name="description" content="A TodoMVC written in React."><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="X-UA-Compatible" content="ie=edge"><title>TodoMVC: React</title><script async="" src="https://www.google-analytics.com/analytics.js"></script><script defer="defer" src="app.bundle.js"></script><link href="app.css" rel="stylesheet"></head><body><section class="todoapp" id="root"><header class="header" data-testid="header"><h1>todos</h1><input class="new-todo" data-testid="text-input" aria-label="New Todo Input" placeholder="What needs to be done?" type="text"></header><main class="main" data-testid="main" hidden=""><div class="toggle-all-container"><input class="toggle-all" id="toggle-all" data-testid="toggle-all" type="checkbox"><label class="toggle-all-label" for="toggle-all">Toggle All Input</label></div><ul class="todo-list" data-testid="todo-list"></ul></main><footer class="footer" data-testid="footer" hidden=""><span class="todo-count">0 items left!</span><ul class="filters" data-testid="footer-navigation"><li><a class="selected" href="#/">All</a></li><li><a class="" href="#/active">Active</a></li><li><a class="" href="#/completed">Completed</a></li></ul><button class="clear-completed" hidden="">Clear completed</button></footer></section><footer class="info"><p>Double-click to edit a todo</p><p>Created by the TodoMVC Team</p><p>Part of <a href="http://todomvc.com">TodoMVC</a></p></footer><script src="./base.js"></script></body></html>
